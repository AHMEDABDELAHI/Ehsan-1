name: AquaFin isolated Windows runtime
on:
  push:
    branches: [aquafin-runtime-20260929]
    paths: ['.github/workflows/aquafin-runtime.yml', 'build_runtime.py']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Build and verify redistributable components only
        run: python build_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: AquaFin-Windows-x64-Runtime
          path: output/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
